version: 0.2

phases:
  install:
    commands:
      - cd frontend && npm ci

  build:
    commands:
      - cd frontend && npm run build

  post_build:
    commands:
      - aws s3 sync frontend/dist/ s3://aws-orders-api-frontend-593777010364/
      - aws cloudfront create-invalidation --distribution-id E2WSAWHEAVEO6K --paths "/*"